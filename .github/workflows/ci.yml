name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium
      - run: npm run dev > /tmp/three-pax-server.log 2>&1 &
      - run: curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://localhost:4186/ -o /dev/null
      - run: npx playwright test -g 'BoomBox|TestBasis|TestGaussianSplats|range sample|stable GPU storage|slow consumer|splat packing|cancelled bootstrap'
